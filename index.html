<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maryam | Portfolio</title>
<meta name="description" content="Architectural visualization, interior design and social media content.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F5F2;--ink:#0F1C24;--blue:#1B3FD1;--line:#C9CFD2;--muted:#56636B}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.75;font-size:17px}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}
header{border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;text-decoration:none}
.links{display:flex;align-items:center;gap:22px;font-size:15px;flex-wrap:wrap}
.links a{text-decoration:none;color:var(--muted)}
.links a:hover{color:var(--ink)}
.lang{font:inherit;font-size:14px;background:none;border:1px solid var(--ink);padding:2px 14px;cursor:pointer;color:var(--ink)}
.hero{padding:84px 0 56px}
h1{font-size:clamp(38px,8vw,84px);font-weight:700;line-height:1.12;max-width:15em}
.hero p{font-size:20px;color:var(--muted);max-width:34em;margin-top:22px}
.dim{display:flex;align-items:center;gap:14px;color:var(--blue);font-size:14px;margin:44px 0 36px}
.dim::before,.dim::after{content:"";flex:1;height:9px;border-inline:1px solid var(--blue);background:linear-gradient(var(--blue),var(--blue)) center/100% 1px no-repeat}
.btn{display:inline-block;background:var(--blue);color:#fff;padding:12px 30px;text-decoration:none;font-weight:600}
.btn:hover{background:var(--ink)}
section{padding:72px 0;border-top:1px solid var(--line)}
h2{font-size:32px;font-weight:700;margin-bottom:34px}
.work{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:34px 22px}
.work figure:first-child{grid-column:span 2}
@media (max-width:640px){.work figure:first-child{grid-column:auto}}
.thumb{position:relative;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:14px;background:
linear-gradient(var(--line) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/28px 28px,#E3E8F6}
.work figure:first-child .thumb{aspect-ratio:auto;height:100%;min-height:240px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
figcaption{padding-top:10px;font-weight:600}
figcaption small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.col{padding:4px 26px;border-inline-start:1px solid var(--line)}
.col:first-child{border-inline-start:0;padding-inline-start:0}
.col h3{font-size:20px;margin-bottom:6px}
.col p{color:var(--muted);font-size:16px}
.about{display:grid;grid-template-columns:2fr 1fr;gap:40px;align-items:start}
.about p{font-size:19px;max-width:34em}
.photo{aspect-ratio:3/4;background:#E3E8F6;position:relative}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media (max-width:700px){.about{grid-template-columns:1fr}.col{border-inline-start:0;padding:14px 0;border-top:1px solid var(--line)}.col:first-child{border-top:0}}
.contact a.btn{margin-inline-end:10px;margin-bottom:10px}
.contact a.alt{background:none;color:var(--ink);border:1px solid var(--ink)}
.contact a.alt:hover{background:var(--ink);color:#fff}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header><div class="wrap"><nav>
<a class="logo" href="#top" data-k="name"></a>
<div class="links">
<a href="#work" data-k="nWork"></a><a href="#services" data-k="nServ"></a><a href="#about" data-k="nAbout"></a><a href="#contact" data-k="nContact"></a>
<button class="lang" id="lang" type="button"></button>
</div></nav></div></header>

<main id="top">
<div class="wrap hero">
<h1 data-k="h1"></h1>
<p data-k="sub"></p>
<div class="dim" data-k="dim"></div>
<a class="btn" href="#work" data-k="cta"></a>
</div>

<section id="work"><div class="wrap">
<h2 data-k="nWork"></h2>
<div class="work" id="grid"></div>
</div></section>

<section id="services"><div class="wrap">
<h2 data-k="nServ"></h2>
<div class="cols">
<div class="col"><h3 data-k="s1t"></h3><p data-k="s1d"></p></div>
<div class="col"><h3 data-k="s2t"></h3><p data-k="s2d"></p></div>
<div class="col"><h3 data-k="s3t"></h3><p data-k="s3d"></p></div>
</div>
</div></section>

<section id="about"><div class="wrap about">
<div><h2 data-k="nAbout"></h2><p data-k="aboutText"></p></div>
<div class="photo"><img src="images/me.jpg" alt="" onerror="this.remove()"></div>
</div></section>

<section id="contact" class="contact"><div class="wrap">
<h2 data-k="nContact"></h2>
<p style="color:var(--muted);margin-bottom:24px" data-k="contactText"></p>
<a class="btn" id="mail" href="#" data-k="mail"></a>
<a class="btn alt" id="wa" href="#" data-k="wa"></a>
<a class="btn alt" id="ig" href="#">Instagram</a>
</div></section>
</main>

<footer><div class="wrap"><span data-k="name"></span> &copy; <span id="yr"></span></div></footer>

<script>
/* ===== EDIT HERE: your contact details ===== */
const CONTACT = {
  email: "you@example.com",        // your email
  whatsapp: "962700000000",        // number with country code, digits only
  instagram: "yourhandle"          // without @
};

/* ===== EDIT HERE: your projects =====
   For each project: put the image in the "images" folder and write its file name in img.
   To add a project, copy one block (from { to },) and paste it below. */
const PROJECTS = [
  { img:"images/archviz-1.jpg", cat:"archviz", en:"Villa exterior at dusk", ar:"واجهة فيلا وقت الغروب" },
  { img:"images/archviz-2.jpg", cat:"archviz", en:"Lobby render", ar:"تصور بهو الاستقبال" },
  { img:"images/interior-1.jpg", cat:"interior", en:"Living room concept", ar:"تصميم غرفة معيشة" },
  { img:"images/interior-2.jpg", cat:"interior", en:"Kitchen design", ar:"تصميم مطبخ" },
  { img:"images/social-1.jpg", cat:"social", en:"Campaign visuals", ar:"تصاميم حملة إعلانية" },
  { img:"images/social-2.jpg", cat:"social", en:"Content series", ar:"سلسلة محتوى" }
];

/* ===== EDIT HERE: texts in both languages ===== */
const T = {
  en: {
    name:"Maryam", nWork:"Work", nServ:"Services", nAbout:"About", nContact:"Contact",
    h1:"Spaces and visuals that tell a story.",
    sub:"Architectural visualization, interior design and social media content.",
    dim:"Architectural visualization / Interior design / Content", cta:"See my work",
    archviz:"Architectural visualization", interior:"Interior design", social:"Social media content",
    s1t:"Architectural visualization", s1d:"Realistic renders that let clients see a building before it is built.",
    s2t:"Interior design", s2d:"Layouts, materials and lighting designed around how people live in the space.",
    s3t:"Social media content", s3d:"Visuals and campaigns made to look good in the feed and keep people watching.",
    aboutText:"I am a designer working between architecture and digital content. I turn ideas into clear images that help clients decide and help brands get noticed. Replace this text with your own story.",
    contactText:"Have a project in mind? Send me a message.", mail:"Email", wa:"WhatsApp", lang:"العربية"
  },
  ar: {
    name:"مريم", nWork:"الأعمال", nServ:"الخدمات", nAbout:"عني", nContact:"تواصل",
    h1:"مساحات وصور تحكي قصة.",
    sub:"تصور معماري، تصميم داخلي، ومحتوى لوسائل التواصل الاجتماعي.",
    dim:"تصور معماري / تصميم داخلي / محتوى", cta:"شاهد أعمالي",
    archviz:"تصور معماري", interior:"تصميم داخلي", social:"محتوى سوشال ميديا",
    s1t:"التصور المعماري", s1d:"صور واقعية تتيح للعميل رؤية المبنى قبل تنفيذه.",
    s2t:"التصميم الداخلي", s2d:"توزيع ومواد وإضاءة مصممة حول طريقة عيش الناس في المكان.",
    s3t:"محتوى السوشال ميديا", s3d:"تصاميم وحملات تبرز في الصفحة وتجذب المتابع.",
    aboutText:"مصممة أعمل بين العمارة والمحتوى الرقمي. أحوّل الأفكار إلى صور واضحة تساعد العميل على القرار وتساعد العلامة على الظهور. استبدل هذا النص بقصتك.",
    contactText:"عندك مشروع؟ راسلني.", mail:"البريد الإلكتروني", wa:"واتساب", lang:"English"
  }
};

let lang = "ar";
try { lang = localStorage.getItem("lang") || "ar"; } catch (e) {}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-k]").forEach(el => { el.textContent = t[el.dataset.k]; });
  document.getElementById("lang").textContent = t.lang;
  document.getElementById("grid").innerHTML = PROJECTS.map(p =>
    '<figure><div class="thumb">' + t[p.cat] +
    '<img src="' + p.img + '" alt="' + p[lang] + '" onerror="this.remove()"></div>' +
    '<figcaption>' + p[lang] + '<small>' + t[p.cat] + '</small></figcaption></figure>'
  ).join("");
}

document.getElementById("lang").addEventListener("click", () => {
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  render();
});
document.getElementById("mail").href = "mailto:" + CONTACT.email;
document.getElementById("wa").href = "https://wa.me/" + CONTACT.whatsapp;
document.getElementById("ig").href = "https://instagram.com/" + CONTACT.instagram;
document.getElementById("yr").textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
