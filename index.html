<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maryam | Portfolio</title>
<meta name="description" content="Architectural visualization, interior design and social media content.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0C;--ink:#F4F1EA;--hot:#FF4B2B;--line:#2A2A2D;--muted:#A8A49B}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:18px}
a{color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px;flex-wrap:wrap}
.logo{font-weight:900;font-size:24px;text-decoration:none}
.links{display:flex;align-items:center;gap:24px;font-size:15px;flex-wrap:wrap}
.links a{text-decoration:none;color:var(--muted);transition:color .2s}
.links a:hover{color:var(--hot)}
.lang{font:inherit;font-size:14px;font-weight:700;background:none;border:2px solid var(--ink);padding:1px 16px;cursor:pointer;color:var(--ink);transition:.2s}
.lang:hover{background:var(--ink);color:var(--bg)}
.hero{padding:110px 0 70px}
h1{font-size:clamp(46px,10vw,128px);font-weight:900;line-height:1.05;max-width:11em}
h1 em{font-style:normal;color:var(--hot)}
.hero p{font-size:22px;color:var(--muted);max-width:30em;margin-top:26px}
.dim{display:flex;align-items:center;gap:14px;color:var(--hot);font-size:14px;font-weight:700;margin:54px 0 40px}
.dim::before,.dim::after{content:"";flex:1;height:11px;border-inline:2px solid var(--hot);background:linear-gradient(var(--hot),var(--hot)) center/100% 2px no-repeat}
.btn{display:inline-block;background:var(--hot);color:var(--bg);padding:14px 36px;text-decoration:none;font-weight:900;font-size:18px;transition:.2s}
.btn:hover{background:var(--ink)}
section{padding:90px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(34px,6vw,64px);font-weight:900;line-height:1.1;margin-bottom:48px}
.work{display:grid;gap:64px}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--hot);font-weight:700;background:
linear-gradient(var(--line) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/32px 32px,#131316}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
figure:hover .thumb img{transform:scale(1.03)}
figcaption{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:14px;font-size:clamp(22px,3.5vw,34px);font-weight:900;line-height:1.3}
figcaption small{font-size:16px;font-weight:400;color:var(--hot);align-self:center}
.svc{border-top:1px solid var(--line);padding:30px 0;display:grid;grid-template-columns:1fr 1fr;gap:12px 40px;align-items:baseline}
.svc:last-child{border-bottom:1px solid var(--line)}
.svc h3{font-size:clamp(24px,4vw,40px);font-weight:900;line-height:1.2}
.svc p{color:var(--muted)}
@media (max-width:700px){.svc{grid-template-columns:1fr}}
.about{display:grid;grid-template-columns:2fr 1fr;gap:48px;align-items:start}
.about p{font-size:clamp(20px,2.6vw,28px);line-height:1.6;max-width:28em}
.photo{aspect-ratio:3/4;background:#131316;position:relative}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media (max-width:700px){.about{grid-template-columns:1fr}}
.big a{display:block;font-size:clamp(30px,6vw,64px);font-weight:900;text-decoration:none;padding:8px 0;border-bottom:1px solid var(--line);transition:.2s}
.big a:hover{color:var(--hot);padding-inline-start:14px}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:14px}
.js .rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s}
.js .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.js .rv{opacity:1;transform:none;transition:none}.thumb img,.btn,.big a{transition:none}}
</style>
</head>
<body>
<header><div class="wrap"><nav>
<a class="logo" href="#top" data-k="name"></a>
<div class="links">
<a href="#work" data-k="nWork"></a><a href="#services" data-k="nServ"></a><a href="#about" data-k="nAbout"></a><a href="#contact" data-k="nContact"></a>
<button class="lang" id="lang" type="button"></button>
</div></nav></div></header>

<main id="top">
<div class="wrap hero">
<h1 data-k="h1"></h1>
<p data-k="sub"></p>
<div class="dim" data-k="dim"></div>
<a class="btn" href="#work" data-k="cta"></a>
</div>

<section id="work"><div class="wrap">
<h2 class="rv" data-k="nWork"></h2>
<div class="work" id="grid"></div>
</div></section>

<section id="services"><div class="wrap">
<h2 class="rv" data-k="nServ"></h2>
<div class="svc rv"><h3 data-k="s1t"></h3><p data-k="s1d"></p></div>
<div class="svc rv"><h3 data-k="s2t"></h3><p data-k="s2d"></p></div>
<div class="svc rv"><h3 data-k="s3t"></h3><p data-k="s3d"></p></div>
</div></section>

<section id="about"><div class="wrap about">
<div class="rv"><h2 data-k="nAbout"></h2><p data-k="aboutText"></p></div>
<div class="photo rv"><img src="images/me.jpg" alt="" onerror="this.remove()"></div>
</div></section>

<section id="contact"><div class="wrap">
<h2 class="rv" data-k="nContact"></h2>
<p style="color:var(--muted);margin-bottom:30px" data-k="contactText"></p>
<div class="big rv">
<a id="mail" href="#" data-k="mail"></a>
<a id="wa" href="#" data-k="wa"></a>
<a id="ig" href="#">Instagram</a>
</div>
</div></section>
</main>

<footer><div class="wrap"><span data-k="name"></span> &copy; <span id="yr"></span></div></footer>

<script>
document.documentElement.classList.add("js");

/* ===== EDIT HERE: your contact details ===== */
const CONTACT = {
  email: "you@example.com",        // your email
  whatsapp: "962700000000",        // number with country code, digits only
  instagram: "yourhandle"          // without @
};

/* ===== EDIT HERE: your projects =====
   For each project: put the image in the "images" folder and write its file name in img.
   To add a project, copy one block (from { to },) and paste it below. */
const PROJECTS = [
  { img:"images/archviz-1.jpg", cat:"archviz", en:"Villa exterior at dusk", ar:"واجهة فيلا وقت الغروب" },
  { img:"images/archviz-2.jpg", cat:"archviz", en:"Lobby render", ar:"تصور بهو الاستقبال" },
  { img:"images/interior-1.jpg", cat:"interior", en:"Living room concept", ar:"تصميم غرفة معيشة" },
  { img:"images/interior-2.jpg", cat:"interior", en:"Kitchen design", ar:"تصميم مطبخ" },
  { img:"images/social-1.jpg", cat:"social", en:"Campaign visuals", ar:"تصاميم حملة إعلانية" },
  { img:"images/social-2.jpg", cat:"social", en:"Content series", ar:"سلسلة محتوى" }
];

/* ===== EDIT HERE: texts in both languages ===== */
const T = {
  en: {
    name:"Maryam", nWork:"Work", nServ:"Services", nAbout:"About", nContact:"Contact",
    h1:"Spaces and visuals that tell a story.",
    sub:"Architectural visualization, interior design and social media content.",
    dim:"Architectural visualization / Interior design / Content", cta:"See my work",
    archviz:"Architectural visualization", interior:"Interior design", social:"Social media content",
    s1t:"Architectural visualization", s1d:"Realistic renders that let clients see a building before it is built.",
    s2t:"Interior design", s2d:"Layouts, materials and lighting designed around how people live in the space.",
    s3t:"Social media content", s3d:"Visuals and campaigns made to look good in the feed and keep people watching.",
    aboutText:"I am a designer working between architecture and digital content. I turn ideas into clear images that help clients decide and help brands get noticed. Replace this text with your own story.",
    contactText:"Have a project in mind? Send me a message.", mail:"Email", wa:"WhatsApp", lang:"العربية"
  },
  ar: {
    name:"مريم", nWork:"الأعمال", nServ:"الخدمات", nAbout:"عني", nContact:"تواصل",
    h1:"مساحات وصور تحكي قصة.",
    sub:"تصور معماري، تصميم داخلي، ومحتوى لوسائل التواصل الاجتماعي.",
    dim:"تصور معماري / تصميم داخلي / محتوى", cta:"شاهد أعمالي",
    archviz:"تصور معماري", interior:"تصميم داخلي", social:"محتوى سوشال ميديا",
    s1t:"التصور المعماري", s1d:"صور واقعية تتيح للعميل رؤية المبنى قبل تنفيذه.",
    s2t:"التصميم الداخلي", s2d:"توزيع ومواد وإضاءة مصممة حول طريقة عيش الناس في المكان.",
    s3t:"محتوى السوشال ميديا", s3d:"تصاميم وحملات تبرز في الصفحة وتجذب المتابع.",
    aboutText:"مصممة أعمل بين العمارة والمحتوى الرقمي. أحوّل الأفكار إلى صور واضحة تساعد العميل على القرار وتساعد العلامة على الظهور. استبدل هذا النص بقصتك.",
    contactText:"عندك مشروع؟ راسلني.", mail:"البريد الإلكتروني", wa:"واتساب", lang:"English"
  }
};

let lang = "ar";
try { lang = localStorage.getItem("lang") || "ar"; } catch (e) {}

const io = "IntersectionObserver" in window
  ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: 0.12 })
  : null;
function reveal(el) { if (io) io.observe(el); else el.classList.add("in"); }

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-k]").forEach(el => { el.textContent = t[el.dataset.k]; });
  document.getElementById("lang").textContent = t.lang;
  const grid = document.getElementById("grid");
  grid.innerHTML = PROJECTS.map(p =>
    '<figure class="rv"><div class="thumb">' + t[p.cat] +
    '<img src="' + p.img + '" alt="' + p[lang] + '" onerror="this.remove()"></div>' +
    '<figcaption>' + p[lang] + '<small>' + t[p.cat] + '</small></figcaption></figure>'
  ).join("");
  grid.querySelectorAll(".rv").forEach(reveal);
}

document.getElementById("lang").addEventListener("click", () => {
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  render();
});
document.getElementById("mail").href = "mailto:" + CONTACT.email;
document.getElementById("wa").href = "https://wa.me/" + CONTACT.whatsapp;
document.getElementById("ig").href = "https://instagram.com/" + CONTACT.instagram;
document.getElementById("yr").textContent = new Date().getFullYear();
document.querySelectorAll(".rv").forEach(reveal);
render();
</script>
</body>
</html>
